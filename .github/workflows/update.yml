name: 更新并发布湖人中文赛程

on:
  workflow_dispatch:
  schedule:
    # 每6小时检查NBA赛程；GitHub cron按UTC执行。
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/index.html'
      - 'docs/lakers.ics'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-lakers-calendar
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 运行离线测试
        run: python -m unittest discover -s tests -v
      - name: 获取NBA赛程并生成中文订阅日历
        run: python scripts/update_schedule.py
      - name: 仅在赛程变化时提交
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- docs/lakers.ics docs/metadata.json)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/lakers.ics docs/metadata.json
            git commit -m 'chore: 同步湖人赛程日历'
            git push
          else
            echo 'NBA赛程无变化，不创建新提交。'
          fi
      - name: 设置 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 上传 Pages 网站内容
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
